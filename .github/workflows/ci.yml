name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile Python sources
        run: python -m py_compile agentic.py agentic_shell.py agentic_dashboard.py src/agentic_runner/*.py
      - name: Check diff whitespace
        run: git diff --check
      - name: Run tests
        run: python -m unittest discover -s tests -q

  package:
    name: Build package
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install build tooling
        run: python -m pip install --upgrade build
      - name: Build sdist and wheel
        run: python -m build
      - name: Install wheel in a clean environment
        run: |
          python -m venv "$RUNNER_TEMP/agentic-smoke"
          "$RUNNER_TEMP/agentic-smoke/bin/python" -m pip install --no-deps dist/*.whl
          (
            cd "$RUNNER_TEMP"
            "$RUNNER_TEMP/agentic-smoke/bin/agentic" --version
            "$RUNNER_TEMP/agentic-smoke/bin/agentic" --help
            "$RUNNER_TEMP/agentic-smoke/bin/agentic-shell" --help
            "$RUNNER_TEMP/agentic-smoke/bin/agentic-dashboard" --help
            "$RUNNER_TEMP/agentic-smoke/bin/agentic" init --help
            "$RUNNER_TEMP/agentic-smoke/bin/agentic" doctor --help
            "$RUNNER_TEMP/agentic-smoke/bin/python" -c 'import agentic_runner; print(agentic_runner.__version__)'
          )

  lint:
    name: Lint (Ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install static checkers
        run: python -m pip install --upgrade "ruff>=0.8" "pyright>=1.1.390"
      - name: Run Ruff
        run: ruff check .
      - name: Run Pyright
        run: pyright

  coverage:
    name: Coverage (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install coverage
        run: python -m pip install --upgrade coverage
      - name: Run tests with coverage
        run: |
          coverage run --source=src/agentic_runner -m unittest discover -s tests -q
          coverage report -m

  sandbox:
    name: Docker sandbox integration
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Build sandbox test image
        run: docker build --tag agentic-sandbox-test:ci tests/fixtures/sandbox
      - name: Run Docker sandbox integration tests
        env:
          AGENTIC_SANDBOX_TEST_IMAGE: agentic-sandbox-test:ci
        run: python -m unittest tests.test_sandbox_integration -v
