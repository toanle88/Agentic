name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile Python sources
        run: python -m py_compile agentic.py agentic_config.py agentic_models.py agentic_security.py agentic_dashboard.py agentic_shell.py
      - name: Run tests
        run: python -m unittest discover -s tests -q

  package:
    name: Build package
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tooling
        run: python -m pip install --upgrade build
      - name: Build sdist and wheel
        run: python -m build
      - name: Install wheel in a clean environment
        run: |
          python -m venv "$RUNNER_TEMP/agentic-smoke"
          "$RUNNER_TEMP/agentic-smoke/bin/python" -m pip install --no-deps dist/*.whl
          "$RUNNER_TEMP/agentic-smoke/bin/agentic" --version
          "$RUNNER_TEMP/agentic-smoke/bin/agentic" --help
          "$RUNNER_TEMP/agentic-smoke/bin/agentic-shell" --help
          "$RUNNER_TEMP/agentic-smoke/bin/agentic-dashboard" --help
          "$RUNNER_TEMP/agentic-smoke/bin/agentic" init --help
          "$RUNNER_TEMP/agentic-smoke/bin/agentic" doctor --help

  lint:
    name: Lint (Ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install static checkers
        run: python -m pip install --upgrade "ruff>=0.8" "pyright>=1.1.390"
      - name: Run Ruff
        run: ruff check agentic.py agentic_config.py agentic_models.py agentic_security.py agentic_dashboard.py agentic_shell.py tests
      - name: Run Pyright
        run: pyright

  windows:
    name: Windows smoke test
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python sources
        run: python -m py_compile agentic.py agentic_config.py agentic_models.py agentic_security.py agentic_dashboard.py agentic_shell.py
      - name: Run tests
        run: python -m unittest discover -s tests -q
