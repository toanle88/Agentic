name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    timeout-minutes: 20
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile Python sources
        run: python -m py_compile agentic.py agentic_shell.py agentic_dashboard.py src/agentic_runner/*.py
      - name: Check diff whitespace
        run: git diff --check
      - name: Run tests
        run: python -m unittest discover -s tests -q

  windows:
    name: Native Windows (Python 3.12)
    timeout-minutes: 30
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Compile Python sources
        shell: pwsh
        run: |
          $runtime = @(
            "agentic.py",
            "agentic_shell.py",
            "agentic_dashboard.py"
          ) + @(Get-ChildItem -Path "src/agentic_runner" -Filter "*.py" | ForEach-Object { $_.FullName })
          python -m py_compile $runtime
      - name: Check diff whitespace
        shell: pwsh
        run: git diff --check
      - name: Run native Windows behavior tests
        shell: pwsh
        run: |
          python -m unittest discover -s tests -p "test_worktrees.py" -v
          python -m unittest discover -s tests -p "test_shell*.py" -v
          python -m unittest discover -s tests -p "test_test_discovery.py" -v
      - name: Run offline unittest suite
        run: python -m unittest discover -s tests -q
      - name: Smoke test installed CLI
        shell: pwsh
        run: |
          $smokeRoot = Join-Path $env:RUNNER_TEMP "agentic-cli-smoke"
          python -m venv $smokeRoot
          $smokePython = Join-Path $smokeRoot "Scripts\python.exe"
          & $smokePython -m pip install --no-deps .
          $smokeBin = Join-Path $smokeRoot "Scripts"
          & (Join-Path $smokeBin "agentic.exe") --version
          & (Join-Path $smokeBin "agentic.exe") --help
          & (Join-Path $smokeBin "agentic-shell.exe") --help
          & (Join-Path $smokeBin "agentic-dashboard.exe") --help
          & (Join-Path $smokeBin "agentic.exe") init --help
          & (Join-Path $smokeBin "agentic.exe") doctor --help
          & $smokePython -c "import agentic_runner; print(agentic_runner.__version__)"

  package:
    name: Build package
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install build tooling
        run: python -m pip install --upgrade "build==1.6.1"
      - name: Build sdist and wheel
        run: python -m build
      - name: Install wheel in a clean environment
        run: |
          python -m venv "$RUNNER_TEMP/agentic-smoke"
          "$RUNNER_TEMP/agentic-smoke/bin/python" -m pip install --no-deps dist/*.whl
          (
            cd "$RUNNER_TEMP"
            "$RUNNER_TEMP/agentic-smoke/bin/agentic" --version
            "$RUNNER_TEMP/agentic-smoke/bin/agentic" --help
            "$RUNNER_TEMP/agentic-smoke/bin/agentic-shell" --help
            "$RUNNER_TEMP/agentic-smoke/bin/agentic-dashboard" --help
            "$RUNNER_TEMP/agentic-smoke/bin/agentic" init --help
            "$RUNNER_TEMP/agentic-smoke/bin/agentic" doctor --help
            "$RUNNER_TEMP/agentic-smoke/bin/python" -c 'import agentic_runner; print(agentic_runner.__version__)'
          )
      - name: Install sdist in a clean environment
        run: |
          python -m venv "$RUNNER_TEMP/agentic-sdist-smoke"
          "$RUNNER_TEMP/agentic-sdist-smoke/bin/python" -m pip install --upgrade "setuptools==84.0.0"
          "$RUNNER_TEMP/agentic-sdist-smoke/bin/python" -m pip install --no-deps --no-build-isolation dist/*.tar.gz
          (
            cd "$RUNNER_TEMP"
            "$RUNNER_TEMP/agentic-sdist-smoke/bin/agentic" --version
            "$RUNNER_TEMP/agentic-sdist-smoke/bin/agentic" --help
            "$RUNNER_TEMP/agentic-sdist-smoke/bin/agentic-shell" --help
            "$RUNNER_TEMP/agentic-sdist-smoke/bin/agentic-dashboard" --help
            "$RUNNER_TEMP/agentic-sdist-smoke/bin/agentic" init --help
            "$RUNNER_TEMP/agentic-sdist-smoke/bin/agentic" doctor --help
            "$RUNNER_TEMP/agentic-sdist-smoke/bin/python" -c 'import agentic_runner; print(agentic_runner.__version__)'
          )

  lint:
    name: Lint (Ruff)
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install static checkers
        run: python -m pip install --upgrade "ruff==0.17.2" "pyright==1.1.414"
      - name: Run Ruff
        run: ruff check .
      - name: Run Pyright
        run: pyright

  coverage:
    name: Coverage (Python 3.12)
    timeout-minutes: 25
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install coverage
        run: python -m pip install --upgrade "coverage==7.6.10"
      - name: Run tests with coverage
        run: |
          coverage run --source=src/agentic_runner -m unittest discover -s tests -q
          coverage xml -o coverage.xml
          coverage html -d htmlcov
          coverage report --fail-under=70 -m
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: |
            coverage.xml
            htmlcov/
          if-no-files-found: ignore
          retention-days: 14

  sandbox:
    name: Docker sandbox integration
    timeout-minutes: 25
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Build sandbox test image
        run: docker build --tag agentic-sandbox-test:ci tests/fixtures/sandbox
      - name: Run Docker sandbox integration tests
        env:
          AGENTIC_SANDBOX_TEST_IMAGE: agentic-sandbox-test:ci
        run: python -m unittest tests.test_sandbox_integration -v
