name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile Python sources
        run: python -m py_compile agentic.py agentic_config.py agentic_context.py agentic_diagnostics.py agentic_dashboard.py agentic_dashboard_data.py agentic_execution.py agentic_execution_providers.py agentic_execution_stream.py agentic_guidance.py agentic_openrouter.py agentic_openrouter_loop.py agentic_openrouter_tools.py agentic_output.py agentic_policy.py agentic_prompts.py agentic_shell.py agentic_shell_commands.py agentic_shell_input.py agentic_models.py agentic_persistence.py agentic_security.py agentic_telemetry.py agentic_sandbox.py agentic_providers.py agentic_review.py agentic_test_discovery.py agentic_workflow.py agentic_worktrees.py
      - name: Check diff whitespace
        run: git diff --check
      - name: Run tests
        run: python -m unittest discover -s tests -q

  package:
    name: Build package
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install build tooling
        run: python -m pip install --upgrade build
      - name: Build sdist and wheel
        run: python -m build
      - name: Install wheel in a clean environment
        run: |
          python -m venv "$RUNNER_TEMP/agentic-smoke"
          "$RUNNER_TEMP/agentic-smoke/bin/python" -m pip install --no-deps dist/*.whl
          "$RUNNER_TEMP/agentic-smoke/bin/agentic" --version
          "$RUNNER_TEMP/agentic-smoke/bin/agentic" --help
          "$RUNNER_TEMP/agentic-smoke/bin/agentic-shell" --help
          "$RUNNER_TEMP/agentic-smoke/bin/agentic-dashboard" --help
          "$RUNNER_TEMP/agentic-smoke/bin/agentic" init --help
          "$RUNNER_TEMP/agentic-smoke/bin/agentic" doctor --help

  lint:
    name: Lint (Ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install static checkers
        run: python -m pip install --upgrade "ruff>=0.8" "pyright>=1.1.390"
      - name: Run Ruff
        run: ruff check .
      - name: Run Pyright
        run: pyright

  coverage:
    name: Coverage (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install coverage
        run: python -m pip install --upgrade coverage
      - name: Run tests with coverage
        run: |
          coverage run --source=agentic,agentic_config,agentic_context,agentic_diagnostics,agentic_dashboard,agentic_dashboard_data,agentic_execution,agentic_execution_providers,agentic_execution_stream,agentic_guidance,agentic_openrouter,agentic_openrouter_loop,agentic_openrouter_tools,agentic_output,agentic_policy,agentic_prompts,agentic_shell,agentic_shell_commands,agentic_shell_input,agentic_models,agentic_persistence,agentic_security,agentic_telemetry,agentic_sandbox,agentic_providers,agentic_review,agentic_test_discovery,agentic_workflow,agentic_worktrees -m unittest discover -s tests -q
          coverage report -m

  sandbox:
    name: Docker sandbox integration
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Build sandbox test image
        run: docker build --tag agentic-sandbox-test:ci tests/fixtures/sandbox
      - name: Run Docker sandbox integration tests
        env:
          AGENTIC_SANDBOX_TEST_IMAGE: agentic-sandbox-test:ci
        run: python -m unittest tests.test_sandbox_integration -v
