[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-runner"
dynamic = ["version"]
description = "A resumable multi-provider coding-agent runner"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "pyright>=1.1.414",
    "ruff>=0.8",
]

[project.scripts]
agentic = "agentic:main"
agentic-dashboard = "agentic_dashboard:main"
agentic-shell = "agentic_shell:main"

[tool.setuptools]
py-modules = ["agentic", "agentic_config", "agentic_dashboard", "agentic_shell", "agentic_models", "agentic_security", "agentic_telemetry", "agentic_sandbox", "agentic_providers", "agentic_review"]

[tool.setuptools.dynamic]
version = {attr = "agentic.__version__"}

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
