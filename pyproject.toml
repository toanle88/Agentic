[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-runner"
version = "0.1.0"
description = "A resumable Codex and GitHub issue coding-agent runner"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = []

[project.scripts]
agentic = "agentic:main"
agentic-dashboard = "agentic_dashboard:main"
agentic-shell = "agentic_shell:main"

[tool.setuptools]
py-modules = ["agentic", "agentic_dashboard", "agentic_shell"]
