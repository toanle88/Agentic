[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-runner"
dynamic = ["version"]
description = "A resumable multi-provider coding-agent runner"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.optional-dependencies]
dev = [
    "build==1.6.1",
    "coverage==7.6.10",
    "pyright==1.1.414",
    "ruff==0.17.2",
]
docs = [
    "mkdocs-material==9.7.7",
]

[project.scripts]
agentic = "agentic_runner.cli:main"
agentic-dashboard = "agentic_runner.dashboard:main"
agentic-shell = "agentic_runner.shell:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "agentic_runner.__version__"}

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
